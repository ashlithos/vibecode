<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>07 · Copilot or Human? (quote quiz)</title>
<style>
/* Shared styles for every prototype. System fonts only, works offline. */
:root{
  --bg:#fff7ee; --card:#ffffff; --card2:#fbf4ff; --ink:#1d1b26; --muted:#6b6880; --line:#eadfd2;
  --accent:#ff5d73; --accent2:#4a6cf7; --good:#16a36a; --warn:#d99000; --bad:#e5484d;
  --shadow:0 6px 22px rgba(60,30,80,.09); --radius:18px;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#15131c; --card:#211e2b; --card2:#2a2438; --ink:#f3f0fa; --muted:#a8a1bd; --line:#363044; --shadow:0 6px 22px rgba(0,0,0,.4); }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{line-height:1.15;margin:.2em 0 .5em}
h1{font-size:clamp(1.8rem,4vw,2.6rem)} h2{font-size:1.5rem} h3{font-size:1.1rem}
small,.muted{color:var(--muted)}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--accent2)}
textarea{min-height:110px;resize:vertical}
details summary{cursor:pointer;color:var(--muted);font-size:.9rem;margin:6px 0}

/* ---------- header / HUD ---------- */
header.top{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 220px}
.brand b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .num{background:var(--ink);color:var(--bg);border-radius:8px;padding:2px 7px;font-size:.8rem;font-weight:700}
.mode{font-size:.75rem;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--line);text-transform:uppercase;letter-spacing:.04em}
.mode.sim{background:var(--accent);color:#fff} .mode.host{background:var(--accent2);color:#fff}
.hud{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.35rem}
.clock small{font-weight:600;font-size:.8rem;margin-left:3px}
.phase{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.phase b{color:var(--ink)} .phase .over{color:var(--bad);font-weight:700}
.ctrls{display:flex;gap:6px;flex-wrap:wrap}
.ctrls .btn{min-height:38px;padding:7px 12px;font-size:.88rem;border-radius:10px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:inherit;font-size:.85rem;font-weight:700;border:0;background:transparent;color:var(--ink);padding:6px 10px;cursor:pointer;min-height:34px}
.seg button.on{background:var(--ink);color:var(--bg)}
.progress{height:5px;background:var(--line)}
.progress div{height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .2s}
.progress div.over{background:var(--bad)}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:16px;max-width:1440px;margin:0 auto}
@media (max-width:960px){.layout{grid-template-columns:1fr}}
main{min-width:0}
#stage{min-height:60vh}
#stage.simlock [data-act]:not([data-act^="core:"]){pointer-events:none}
.fade{animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;border:1px solid var(--line);margin-bottom:16px}
.card.tint{background:var(--card2)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.cols>.card{margin-bottom:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.center{text-align:center}
.stack>*+*{margin-top:12px}
.kicker{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lead{font-size:1.15rem;color:var(--muted);max-width:60ch}
.big-text{font-size:clamp(1.3rem,3vw,2rem);font-weight:750;line-height:1.25}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
ul.tight{margin:.3em 0;padding-left:1.2em} ul.tight li{margin:.25em 0}

/* ---------- buttons & chips ---------- */
.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 20px;min-height:48px;cursor:pointer;background:var(--accent2);color:#fff;transition:transform .08s,filter .15s;display:inline-flex;align-items:center;gap:8px;justify-content:center;text-decoration:none}
.btn:hover{filter:brightness(1.07)} .btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{font-size:1.12rem;padding:16px 24px;min-height:58px}
.btn.pink{background:var(--accent)} .btn.green{background:var(--good)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.small{min-height:38px;padding:7px 12px;font-size:.9rem;border-radius:10px}
.pchip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:99px;background:color-mix(in srgb,var(--pc) 16%,transparent);border:1.5px solid color-mix(in srgb,var(--pc) 45%,transparent);font-weight:650;font-size:.92rem;white-space:nowrap}
.pchip .pe{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--pc);font-size:.9rem}
.pchip.big{font-size:1.05rem;padding:6px 14px 6px 6px}.pchip.big .pe{width:34px;height:34px;font-size:1.1rem}
.pchip.dim{opacity:.45}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--ink)}
.tag.good{background:var(--good);color:#fff}.tag.warn{background:var(--warn);color:#fff}.tag.bad{background:var(--bad);color:#fff}
.script{border-left:4px solid var(--accent);background:var(--card2);padding:10px 14px;border-radius:0 12px 12px 0;margin:10px 0;font-size:1rem}
.script b{color:var(--accent)}

/* ---------- player status grid ---------- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.pcell{border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--card);display:flex;flex-direction:column;gap:6px;position:relative}
.pcell.done{border-color:var(--good)}
.pcell .status{position:absolute;top:8px;right:10px;font-size:1.1rem}
.pcell .cat{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.pcell input{min-height:40px;padding:7px 10px}
.counter{font-weight:800;font-size:1.1rem}

/* ---------- round timer ---------- */
.roundtimer{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding:10px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:800;font-variant-numeric:tabular-nums}
.roundtimer .t{font-size:1.6rem}
.roundtimer .bar{flex:1;height:8px;border-radius:9px;background:rgba(127,127,127,.35);overflow:hidden}
.roundtimer .bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.roundtimer.ding{background:var(--bad);animation:pulse .6s infinite alternate}
@keyframes pulse{to{filter:brightness(1.25)}}

/* ---------- transcript ---------- */
.logwrap{position:sticky;top:76px;align-self:start;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:calc(100vh - 100px)}
@media (max-width:960px){.logwrap{position:static;max-height:420px}}
.loghead{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:800;display:flex;justify-content:space-between}
#log{overflow:auto;padding:8px 10px 14px;font-size:.88rem}
.le{padding:4px 2px;border-bottom:1px dashed var(--line);animation:fadeIn .25s}
.le .ts{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.78rem;margin-right:6px}
.le.sys{color:var(--muted);font-style:italic}
.le.phase{font-weight:800;color:var(--accent2);border-bottom:2px solid var(--line);padding-top:10px}
.le.say b{margin-right:4px}
#bubbles{position:fixed;left:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:40;max-width:min(380px,calc(100vw - 32px));pointer-events:none}
@media (max-width:960px){#bubbles{left:16px;right:16px;bottom:10px;max-width:none}.bubble{font-size:.85rem;padding:6px 10px;opacity:.97}}
.bubble{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:2px solid var(--pc);border-radius:16px 16px 16px 4px;padding:8px 12px;box-shadow:var(--shadow);animation:pop .25s ease;font-size:.95rem}
.bubble .pe{display:grid;place-items:center;min-width:30px;height:30px;border-radius:50%;background:var(--pc)}
.bubble.out{opacity:0;transform:translateY(6px);transition:all .3s}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}

/* ---------- placeholder generation cards ---------- */
.gen{position:relative;border-radius:18px;overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);max-width:520px}
.gen-art{aspect-ratio:4/3;display:grid;place-items:center;background:linear-gradient(135deg,hsl(var(--h1) 85% 70%),hsl(var(--h2) 80% 55%));position:relative}
.gen.poster .gen-art{aspect-ratio:2/3}
.gen.square .gen-art{aspect-ratio:1/1}
.gen-art .em{font-size:clamp(3rem,9vw,5.2rem);filter:drop-shadow(0 6px 10px rgba(0,0,0,.2));letter-spacing:.05em;text-align:center;line-height:1.1}
.gen-art .over{position:absolute;inset:auto 0 0 0;padding:14px;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;text-align:center}
.gen-art .over .pt{font-weight:900;font-size:1.3rem;text-transform:uppercase;letter-spacing:.03em;line-height:1.1}
.gen-art .over .ps{font-size:.85rem;opacity:.9;font-style:italic}
.gen-meta{padding:12px 14px;font-size:.9rem}
.gen-kind{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.gen-title{font-weight:800;font-size:1.05rem;margin:2px 0 4px}
.gen-prompt{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.8rem;background:var(--bg);border-radius:8px;padding:8px;margin-top:6px;color:var(--muted)}
.gen-load{position:absolute;inset:0;display:none;place-items:center;background:linear-gradient(110deg,var(--card) 30%,var(--card2) 50%,var(--card) 70%);background-size:300% 100%;animation:shimmer 1.2s linear infinite;font-weight:800;color:var(--muted);z-index:2}
.gen.loading .gen-load{display:grid}
.gen.done .gen-art .em{animation:pop .5s ease}
@keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}

/* ---------- votes ---------- */
.vcat{margin:10px 0 16px}
.vtitle{font-weight:800;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.vbar{display:grid;grid-template-columns:minmax(90px,38%) 1fr 28px;gap:8px;align-items:center;margin:5px 0;font-size:.93rem}
.vbar .bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbar .bt{height:16px;border-radius:9px;background:var(--line);overflow:hidden}
.vbar .bt i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:9px;transition:width .3s}
.vbar.win .bl{font-weight:800}
.vrow{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.vname{min-width:92px;font-weight:650;font-size:.9rem}
.vopts{display:flex;flex-wrap:wrap;gap:4px}
.vopt{font:inherit;font-size:.8rem;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:5px 8px;min-height:34px;cursor:pointer}
.vopt.sel{background:var(--accent2);border-color:var(--accent2);color:#fff}
.vopt:disabled{opacity:.3;cursor:not-allowed}

/* ---------- report ---------- */
.rtable{width:100%;border-collapse:collapse;font-size:.92rem}
.rtable th,.rtable td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.rtable td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.rbar{position:relative;height:10px;border-radius:6px;background:var(--line);min-width:80px}
.rbar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--good)}
.rbar i.over{background:var(--bad)}
.rbar s{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.verdict{font-size:1.2rem;font-weight:800;padding:12px 16px;border-radius:14px;margin:8px 0}
.verdict.good{background:color-mix(in srgb,var(--good) 18%,transparent)}
.verdict.warn{background:color-mix(in srgb,var(--warn) 22%,transparent)}
.verdict.bad{background:color-mix(in srgb,var(--bad) 18%,transparent)}
.notes h4{margin:14px 0 4px}
.risk{border:2px solid var(--warn);border-radius:14px;padding:12px 14px;background:color-mix(in srgb,var(--warn) 10%,transparent)}

dialog{border:0;border-radius:20px;padding:0;max-width:min(720px,calc(100vw - 24px));width:100%;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,5,20,.55)}
dialog .dlg{padding:22px;max-height:80vh;overflow:auto}

/* ---------- landing ---------- */
.hero{background:linear-gradient(135deg,var(--card),var(--card2))}
.namegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:14px 0}
.namefield{display:flex;align-items:center;gap:8px}
.namefield .pe{display:grid;place-items:center;min-width:42px;height:42px;border-radius:50%;background:var(--pc);font-size:1.2rem}

@media (max-width:600px){
  body{font-size:16px}
  .card{padding:16px}
  .layout{padding:12px 16px}
  .hud{gap:8px}
}

/* ---------- slot sentence ---------- */
.slots{line-height:2.4}
.slot{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:2px 3px;padding:0 12px;border-radius:14px;border:2px dashed var(--line);min-width:88px;line-height:1.2;padding-top:4px;padding-bottom:3px}
.slot .sw{opacity:0;transform:translateY(-34px) scale(.5) rotate(-8deg)}
.slot .sc{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.slot.in{border-style:solid;border-color:var(--pc);background:color-mix(in srgb,var(--pc) 14%,transparent)}
.slot.in .sw{opacity:1;transform:none;transition:all .5s cubic-bezier(.3,1.7,.5,1)}

</style>
</head>
<body>
<!--
  07 · Copilot or Human? (quote quiz): single-file playtest prototype (generated by build.py; edit src/ instead).
  REAL API PLUG-IN POINT: every AI result is a placeholder card made by Core.genCard() and
  revealed by Core.generate(). To go live, replace Core.generate() with a call to a real
  image / video / audio API using the prompt shown on the card.
-->
<noscript>This prototype needs JavaScript enabled.</noscript>
<script>
/* Core engine shared by every prototype. The build step inlines it into each HTML file,
   so every file stays a single self-contained page that works offline.

   Game time vs real time:
   - Host mode: the session clock is real time (it starts when you click "Start the session").
   - Simulate mode: the session clock is *game* time. Core.wait(sec) advances game time by
     `sec`, but only takes sec / speed real seconds. At 25x a 30-minute session plays in ~72s.
*/
(function () {
  'use strict';

  const PERSONAS = [
    { id: 'maya',  name: 'Maya',  tag: 'the chaotic',      emoji: '🌪️', color: '#ff5d73' },
    { id: 'dev',   name: 'Dev',   tag: 'the deadpan',      emoji: '🗿', color: '#7b8794' },
    { id: 'priya', name: 'Priya', tag: 'the wholesome',    emoji: '🌻', color: '#e8a317' },
    { id: 'leo',   name: 'Leo',   tag: 'the overachiever', emoji: '🚀', color: '#4a6cf7' },
    { id: 'sam',   name: 'Sam',   tag: 'the quiet one',    emoji: '🐢', color: '#16a36a' },
    { id: 'zoe',   name: 'Zoe',   tag: 'the punster',      emoji: '🎭', color: '#9b59b6' },
    { id: 'omar',  name: 'Omar',  tag: 'the storyteller',  emoji: '📚', color: '#e67e22' },
  ];

  // ---------- small utils ----------
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const rand = (a, b) => a + Math.random() * (b - a);
  const randi = (a, b) => Math.floor(rand(a, b + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const sample = (a, n) => shuffle(a).slice(0, n);
  const chance = p => Math.random() < p;
  const fmt = s => { s = Math.max(0, Math.round(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  // Random permutation with no fixed points (nobody gets themselves).
  function derange(n, noMutual) {
    for (let tries = 0; tries < 5000; tries++) {
      const p = shuffle([...Array(n).keys()]);
      if (p.some((v, i) => v === i)) continue;
      if (noMutual && p.some((v, i) => p[v] === i)) continue;
      return p;
    }
    return [...Array(n).keys()].map(i => (i + 1) % n);
  }
  function hash(s) { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return Math.abs(h); }

  // ---------- state ----------
  const S = {
    mode: null, cfg: null, players: PERSONAS.map(p => ({ ...p })),
    clock: 0, running: false, paused: false, speed: 25, last: Date.now(), waiters: [],
    phase: null, phases: [], timer: null, boards: {}, realStart: 0, finished: false,
  };
  const player = p => p == null ? null : typeof p === 'object' ? p : typeof p === 'number' ? S.players[p] : S.players.find(x => x.id === p);

  // ---------- clock ----------
  setInterval(() => {
    const t = Date.now(), dt = (t - S.last) / 1000; S.last = t;
    if (S.running && !S.paused) {
      if (S.mode === 'host') S.clock += dt;
      else if (S.mode === 'sim' && S.waiters.length) {
        // Several waits can be pending at once (e.g. an un-awaited generate()); advance to the nearest.
        const adv = Math.min(dt * S.speed, ...S.waiters.map(w => w.left));
        S.clock += adv;
        const due = [];
        S.waiters = S.waiters.filter(w => { w.left -= adv; if (w.left <= 1e-6) { due.push(w.res); return false; } return true; });
        due.forEach(r => r());
      }
    }
    hud();
  }, 50);

  /** Advance game time (simulate mode only). Resolves immediately in host mode. */
  function wait(sec) {
    if (S.mode !== 'sim' || S.finished) return Promise.resolve();
    return new Promise(res => { S.waiters.push({ left: Math.max(0, sec), res }); });
  }

  function hud() {
    const clk = $('#clk'); if (!clk) return;
    const target = (S.cfg && S.cfg.target) || 1800;
    clk.textContent = fmt(S.clock);
    const prog = $('#prog');
    prog.style.width = Math.min(100, S.clock / target * 100) + '%';
    prog.classList.toggle('over', S.clock > target);
    const ph = $('#phName'), pl = $('#phLeft');
    if (S.phase && !S.finished) {
      ph.innerHTML = '<b>' + esc(S.phase.name) + '</b>';
      const left = S.phase.budget - (S.clock - S.phase.start);
      pl.innerHTML = left >= 0 ? fmt(left) + ' left' : '<span class="over">+' + fmt(-left) + ' over</span>';
    } else { ph.textContent = S.finished ? 'Finished' : 'Not started'; pl.textContent = ''; }
    const rt = $('#rt');
    if (S.timer) {
      const left = S.timer.sec - (S.clock - S.timer.start);
      rt.hidden = false;
      rt.classList.toggle('ding', left <= 0);
      rt.innerHTML = '<span>⏱ ' + esc(S.timer.label) + '</span><span class="bar"><i style="width:' + Math.max(0, left / S.timer.sec * 100) + '%"></i></span><span class="t">' + (left > 0 ? fmt(left) : "Time!") + '</span>';
    } else rt.hidden = true;
  }

  // ---------- phases & timers ----------
  function closePhase() { if (S.phase && S.phase.actual == null) S.phase.actual = S.clock - S.phase.start; }
  function phase(name, budgetSec) {
    // Real rooms lose 6–14s at every phase change ("okay, eyes up here…"); charge it to the phase that's ending.
    if (S.mode === 'sim' && S.phase) S.clock += rand(6, 14);
    closePhase();
    S.phase = { name, budget: budgetSec, start: S.clock, actual: null };
    S.phases.push(S.phase);
    log(null, '— ' + name + ' (budget ' + fmt(budgetSec) + ') —', 'phase');
    hud();
  }
  function timer(label, sec) { S.timer = { label, sec, start: S.clock }; hud(); }
  function clearTimer() { S.timer = null; hud(); }
  const timerLeft = () => S.timer ? S.timer.sec - (S.clock - S.timer.start) : 0;

  // ---------- transcript ----------

  function emojisFor(prompt, max) {

  // ---------- vote board ----------
  let vbN = 0;
  class VoteBoard {
    /** options: [{id,label,emoji?,short?}], cats: [{id,label}], exclude(voter, option) -> bool */
    constructor(o) {

      this.options = o.options; this.voters = o.voters || S.players;
      this.cats = o.cats || [{ id: 'main', label: o.title || 'Vote' }];
      this.exclude = o.exclude; this.onChange = o.onChange;
      this.votes = {}; this.cats.forEach(c => this.votes[c.id] = {});
      S.boards[this.id] = this;
    }

    tally(cat) { cat = cat || this.cats[0].id; return this.options.map(o => ({ id: o.id, label: o.label, emoji: o.emoji, n: this.count(cat, o.id) })).sort((a, b) => b.n - a.n); }
    winner(cat) { return this.tally(cat)[0]; }
    voted(cat) { return Object.keys(this.votes[cat || this.cats[0].id]).length; }
    cast(voter, opt, cat) { cat = cat || this.cats[0].id; this.votes[cat][voter] = opt; this.refresh(); }
    html() { return '<div class="vboard" id="' + this.id + '">' + this.inner() + '</div>'; }

      return this.cats.map(c => {
        const max = Math.max(1, ...this.options.map(o => this.count(c.id, o.id)));

  /** Synthetic voters vote one by one. chooser(voter) -> option id. */
  async function simVotes(board, chooser, o) {
    o = o || {}; const cat = o.cat || board.cats[0].id;
    for (const v of shuffle(board.voters)) {
      let opt = chooser(v);
      if (board.exclude && board.exclude(v, board.options.find(x => x.id === opt))) opt = pick(board.options.filter(x => !board.exclude(v, x))).id;
      board.cast(v.id, opt, cat);

    }
    await wait(o.straggler == null ? 6 : o.straggler); // "is everyone in?" — waiting on the last voter
    const label = board.cats.find(c => c.id === cat).label;

  }

  // ---------- finish / report ----------
  function finish(resultHtml) {

    const rows = [];
    for (const p of S.phases) {

      if (!r) { r = { name: p.name, budget: 0, actual: 0, n: 0 }; rows.push(r); }

    const v = total <= target - 60 ? ['good', '✅ Fits in ' + fmt(target) + ' with ' + fmt(target - total) + ' to spare']
      : total <= target ? ['warn', '🟡 Fits, but with almost no buffer (' + fmt(target - total) + ' left)']
      : ['bad', '🔴 Over the ' + fmt(target) + ' slot by ' + fmt(total - target) + '. See the suggested cut below'];
    const maxv = Math.max(...rows.map(r => Math.max(r.actual, r.budget)), 1);
    const realSec = (Date.now() - S.realStart) / 1000;
    const leaks = rows.filter(r => r.actual > r.budget + 15).sort((a, b) => (b.actual - b.budget) - (a.actual - a.budget));
    stage((resultHtml || '') +
      '<div class="card"><h2>⏱ Pacing report</h2><div class="verdict ' + v[0] + '">' + v[1] + '</div>' +
      '<p class="muted">' + (S.mode === 'sim' ? 'Simulated ' + fmt(total) + ' of session time in ' + Math.round(realSec) + ' real seconds. ' : 'Real time measured while you hosted. ') +

      rows.map(r => '<tr><td>' + esc(r.name) + (r.n > 1 ? ' <small>×' + r.n + '</small>' : '') + '</td><td class="n">' + fmt(r.budget) + '</td><td class="n">' + fmt(r.actual) + '</td><td><div class="rbar"><i class="' + (r.actual > r.budget + 5 ? 'over' : '') + '" style="width:' + (r.actual / maxv * 100) + '%"></i><s style="left:' + (r.budget / maxv * 100) + '%"></s></div></td></tr>').join('') +
      '<tr><th>Total</th><th class="n">' + fmt(budget) + '</th><th class="n">' + fmt(total) + '</th><th></th></tr></table>' +
      (leaks.length ? '<p><b>Where time leaked:</b> ' + leaks.slice(0, 3).map(r => esc(r.name) + ' (+' + fmt(r.actual - r.budget) + ')').join(', ') + '</p>' : '<p><b>No phase ran meaningfully over budget.</b></p>') +
      '</div><div class="card tint">' + notesHtml() + '</div>' +
      '<div class="cta"><button class="btn big pink" data-act="core:sim">▶ Simulate again</button><button class="btn big ghost" data-act="core:host">🎤 Try Host mode</button><button class="btn big ghost" data-act="core:restart">↺ Back to start</button></div>');
    ctrls(); hud();
  }

  // ---------- modes ----------
  function reset(mode) {
    S.mode = mode; S.clock = 0; S.phase = null; S.phases = []; S.timer = null; S.finished = false; S.paused = false; S.boards = {};
    S.waiters = [];
    S.runId = (S.runId || 0) + 1;
    $('#log').innerHTML = ''; $('#stage').classList.toggle('simlock', mode === 'sim');
  }
  async function startSim() {
    reset('sim'); S.players = PERSONAS.map(p => ({ ...p }));
    S.running = true; S.realStart = Date.now(); ctrls();
    log(null, '▶ Simulation started with 7 synthetic players at ' + S.speed + '× speed', 'sys');
    const run = S.runId;
    try { await S.cfg.simulate(); } catch (e) { if (run === S.runId) { console.error(e); log(null, '⚠️ Simulation error: ' + e.message, 'sys'); } }
    if (run === S.runId && !S.finished) finish(S.cfg.summary ? S.cfg.summary() : '');
  }
  function startHost() { reset('host'); S.running = false; ctrls(); setup(); log(null, 'Host mode. Name the players, then start.', 'sys'); }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const a = el.dataset.act;
    if (a.indexOf('core:') === 0) {
      const k = a.slice(5);
      if (k === 'sim') startSim();
      else if (k === 'host') startHost();
      else if (k === 'go') {
        $$('.namefield input').forEach(inp => { const v = inp.value.trim(); if (v) S.players[+inp.dataset.i].name = v; });
        S.running = true; S.realStart = Date.now(); S.last = Date.now(); ctrls();
        log(null, '🎤 Session started: ' + S.players.map(p => p.name).join(', '), 'sys');
        S.cfg.host();
      }
      else if (k === 'pause') { S.paused = !S.paused; ctrls(); }
      else if (k === 'speed') { S.speed = +el.dataset.x; ctrls(); }
      else if (k === 'notes') { $('#notesBody').innerHTML = notesHtml() + '<p><button class="btn" data-act="core:closeNotes">Close</button></p>'; $('#notesDlg').showModal(); }
      else if (k === 'closeNotes') $('#notesDlg').close();
      else if (k === 'end') finish(S.cfg.summary ? S.cfg.summary() : '');
      else if (k === 'restart') { S.runId++; S.mode = null; S.running = false; S.finished = false; S.waiters = []; S.timer = null; S.phase = null; S.players = PERSONAS.map(p => ({ ...p })); $('#log').innerHTML = ''; $('#stage').classList.remove('simlock'); ctrls(); hud(); landing(); }
      else if (k === 'vote') { if (S.mode !== 'host') return; const b = S.boards[el.dataset.b]; if (b) b.cast(el.dataset.v, el.dataset.o, el.dataset.c); }
      return;
    }
    if (S.mode !== 'host') return;
    const fn = S.cfg.acts && S.cfg.acts[a];
    if (fn) { e.preventDefault(); fn(el.dataset, el, e); }
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.shiftKey) return;
    const el = e.target.closest('[data-enter]'); if (!el || S.mode !== 'host') return;
    const fn = S.cfg.acts && S.cfg.acts[el.dataset.enter];
    if (fn) { e.preventDefault(); fn(el.dataset, el, e); }
  });

  // ---------- public API ----------
  window.Core = {
    game(cfg) { S.cfg = cfg; shell(); landing(); },
    get players() { return S.players; }, get mode() { return S.mode; }, get clock() { return S.clock; },
    get finished() { return S.finished; },
    PERSONAS, player, chip, script, stage, log, say, act, sys, wait, sleep, phase, timer, clearTimer, timerLeft, finish,
    genCard, generate, emojisFor, slotSentence, revealSlots, collectGrid, readGrid, markGrid, VoteBoard, simVotes, esc, rand, randi, pick, shuffle, sample, chance, fmt, derange, hash, $, $$,
    css(t) { const s = document.createElement('style'); s.textContent = t; document.head.appendChild(s); },
    /** Real-time pause in host mode, game-time wait in sim. */
    beat(sec, ms) { return S.mode === 'sim' ? wait(sec) : sleep(ms == null ? 600 : ms); },
  };
})();

</script>
<script>
// TITLE: 07 · Copilot or Human? (quote quiz)
(function () {
  const C = Core;
  // Real, famous movie quotes (verbatim as commonly cited).
  const REAL = [
    ['Here’s looking at you, kid.', 'Casablanca (1942)'],
    ['You’re gonna need a bigger boat.', 'Jaws (1975)'],
    ['Houston, we have a problem.', 'Apollo 13 (1995)'],
    ['Carpe diem. Seize the day, boys. Make your lives extraordinary.', 'Dead Poets Society (1989)'],
    ['Roads? Where we’re going, we don’t need roads.', 'Back to the Future (1985)'],
    ['Keep your friends close, but your enemies closer.', 'The Godfather Part II (1974)'],
    ['Just keep swimming.', 'Finding Nemo (2003)'],
    ['To infinity and beyond!', 'Toy Story (1995)'],
    ['There’s no place like home.', 'The Wizard of Oz (1939)'],
    ['You can’t handle the truth!', 'A Few Good Men (1992)'],
  ];
  // Plausible AI-generated "movie quotes" (written for this prototype, not from any film).
  const AI = [
    ['Some doors only open from the inside, and most of us never think to knock.', 'sounds like: a 2000s indie drama'],
    ['You don’t get to choose the storm. You only get to choose who’s in the boat with you.', 'sounds like: a sports-team underdog movie'],
    ['I didn’t come all this way to be ordinary, Charlie.', 'sounds like: a coming-of-age road trip'],
    ['The map was never the problem. We were.', 'sounds like: an adventure-movie finale'],
    ['Every hero is just someone who stayed five minutes longer.', 'sounds like: a firefighter drama'],
    ['Don’t look back, kid. The past already knows where you live.', 'sounds like: a neo-noir thriller'],
    ['We’re not lost. We’re just early.', 'sounds like: a sci-fi space epic'],
    ['If the world’s going to end, I’d at least like to finish my coffee.', 'sounds like: a disaster-movie comic relief'],
    ['Courage isn’t loud. Sometimes it just gets up and goes to work.', 'sounds like: an Oscar-bait biopic'],
    ['Funny thing about tomorrow: it never shows up when you’re waiting for it.', 'sounds like: a 90s romantic drama'],
  ];
  // How good each persona is at spotting AI (probability of answering correctly).
  const SKILL = { maya: .5, dev: .72, priya: .6, leo: .78, sam: .68, zoe: .55, omar: .62 };
  const ROUNDS = 10;

  let st;
  const fresh = () => ({ deck: [], i: 0, board: null, score: {}, hist: [] });
  function deck() {
    const r = C.sample(REAL, 5).map(q => ({ text: q[0], src: q[1], real: true }));
    const a = C.sample(AI, 5).map(q => ({ text: q[0], src: q[1], real: false }));
    return C.shuffle(r.concat(a));
  }
  const lb = () => '<table class="rtable">' + C.players.slice().sort((a, b) => (st.score[b.id] || 0) - (st.score[a.id] || 0)).map((p, i) => '<tr><td>' + (i + 1) + '</td><td>' + C.chip(p) + '</td><td class="n"><b>' + (st.score[p.id] || 0) + '</b></td></tr>').join('') + '</table>';

  function quoteScreen(reveal) {
    const q = st.deck[st.i];
    if (!reveal) st.board = new C.VoteBoard({ title: 'Human or AI?', options: [{ id: 'human', label: 'Human (real movie)', emoji: '🎬' }, { id: 'ai', label: 'AI-generated', emoji: '🤖' }] });
    C.stage('<div class="card quote ' + (reveal ? (q.real ? 'is-real' : 'is-ai') : '') + '"><div class="kicker">Quote ' + (st.i + 1) + ' of ' + ROUNDS + '</div><blockquote>“' + C.esc(q.text) + '”</blockquote>' +
      (reveal ? '<p class="big-text">' + (q.real ? '🎬 REAL: <i>' + C.esc(q.src) + '</i>' : '🤖 AI-GENERATED · ' + C.esc(q.src)) + '</p>' : '') + '</div>' +
      '<div class="cols"><div class="card">' + st.board.html() + (C.mode === 'host' ? '<div class="cta">' + (reveal ? '<button class="btn big" data-act="next">' + (st.i < ROUNDS - 1 ? 'Next quote →' : '🏆 Final scores') + '</button>' : '<button class="btn big pink" data-act="reveal">Reveal →</button>') + '</div>' : '') + '</div>' +
      '<div class="card"><h3>Scoreboard</h3>' + lb() + '</div></div>');
  }
  function score() {
    const q = st.deck[st.i], right = q.real ? 'human' : 'ai';
    Object.entries(st.board.votes.main).forEach(([v, o]) => { if (o === right) st.score[v] = (st.score[v] || 0) + 1; });
    st.hist.push({ q, pct: st.board.count('main', right) / 7 });
  }
  function summary() {
    if (!st.hist.length) return '';
    const hard = st.hist.slice().sort((a, b) => a.pct - b.pct)[0];
    return '<div class="card"><h2>🏆 Final scores</h2>' + lb() + '<p><b>Hardest quote:</b> “' + C.esc(hard.q.text) + '”: only ' + Math.round(hard.pct * 100) + '% got it right (' + (hard.q.real ? 'it was real: ' + C.esc(hard.q.src) : 'it was AI') + ').</p></div>';
  }

  const acts = {
    start() { st.i = 0; C.phase('Quiz rounds', 600); C.timer('Vote', 20); quoteScreen(false); },
    reveal() { C.clearTimer(); score(); quoteScreen(true); },
    next() { if (st.i < ROUNDS - 1) { st.i++; C.timer('Vote', 20); quoteScreen(false); } else { C.phase('Final scores', 60); C.stage(summary() + '<button class="btn big" data-act="end">🏁 Finish & pacing report</button>'); } },
    end() { C.finish(summary()); },
  };

  async function simulate() {
    st = fresh(); st.deck = deck();
    C.phase('Intro', 60); C.stage('<div class="card"><h2>🤖 or 🎬?</h2>' + C.script('Ten movie quotes. Half are real, half were written by an AI. Vote: human or AI?') + '</div>');
    await C.sys('Facilitator explains', 40); await C.say('dev', 'I’ve seen every movie. This will be easy.', 8);
    C.phase('Quiz rounds', 600);
    for (let i = 0; i < ROUNDS; i++) {
      st.i = i; const q = st.deck[i]; C.timer('Vote', 20); quoteScreen(false);
      await C.sys('Quote read aloud', 6);
      if (C.chance(.5)) await C.say(C.pick(C.players), C.pick(['That’s definitely from something.', 'Too inspirational. AI.', 'I feel like Tom Hanks said this.', 'This is a fortune cookie.', 'Wait, I know this one!']), 5);
      await C.simVotes(st.board, v => { const right = q.real ? 'human' : 'ai'; return C.chance(SKILL[v.id] + (q.real && /Toy|Nemo|Oz|Jaws/.test(q.src) ? .25 : 0)) ? right : (right === 'ai' ? 'human' : 'ai'); }, { gap: 1.8, straggler: 3 });
      C.clearTimer(); score(); quoteScreen(true); await C.wait(4);
      const pct = st.hist[st.hist.length - 1].pct;
      await C.sys(pct < .5 ? 'Groans: “NO WAY that’s ' + (q.real ? 'real' : 'AI') + '!”' : 'Mostly nods. Some smugness.', 6);
      if (i % 3 === 2) await C.say(C.pick(C.players), C.pick(['How is that AI? It made me feel something.', 'I need a rematch.', 'Leo is suspiciously good at this.']), 8);
      if (i === 6) await C.sys('Energy dips a little: rounds are starting to feel the same', 3);
      await C.wait(6);
    }
    C.phase('Final scores', 60); C.stage(summary()); await C.sys('Winner crowned 👑', 30);
  }

  C.css('.quote blockquote{font-size:clamp(1.4rem,3.5vw,2.3rem);font-weight:750;line-height:1.3;margin:14px 0;font-family:Georgia,serif}.quote.is-real{border-color:var(--good);border-width:3px}.quote.is-ai{border-color:var(--accent2);border-width:3px}');

  C.game({
    num: '07', title: 'Copilot or Human?', emoji: '🤖',
    tagline: 'A 10-round quiz. Each round shows one movie quote: a real famous one, or one an AI wrote. Everyone votes: human or AI?',
    how: '<ol class="tight"><li>Quote appears and is read aloud</li><li>20 seconds: vote 🎬 human or 🤖 AI</li><li>Reveal (with the movie, if real) + scores</li><li>10 rounds (5 real, 5 AI, shuffled)</li></ol>',
    plan: [{ name: 'Intro', sec: 60 }, { name: 'Quiz rounds', sec: 600 }, { name: 'Final scores', sec: 60 }],
    evaluating: ['Quiz pacing for 10 rounds in ~15 min?', 'Is it fun, or does it feel like trivia night?'],
    notes: '<p><b>Verdict: smooth and fast, but it <i>is</i> trivia night.</b> 10 rounds take about 9 min, well inside 15. Good as an opener or closer, not the main event.</p>' +
      '<h4>Pacing</h4><p>About 55–65s per round. Rounds 1–4 are lively (“I KNOW this one!”); by round 7 the rhythm feels samey. Famous quotes (Toy Story, Nemo) are too easy, while obscure real quotes and vague AI quotes are where the fun is.</p>' +
      '<h4>Making it less trivia, more team</h4><ul class="tight"><li>After each reveal, ask one person: “what gave it away?” 20s of real conversation about how we read AI.</li><li>Round 10 twist: show a quote the <i>team</i> wrote vs. one the AI wrote.</li><li>Play in pairs, so new teammates have to agree before voting. That’s a micro-collaboration.</li></ul>' +
      '<div class="risk"><b>Facilitator risk note:</b> very low. Individual scores can make people who don’t watch films feel left out, so consider showing team-pair scores instead.</div>',
    host() {
      st = fresh(); st.deck = deck(); C.phase('Intro', 60);
      C.stage('<div class="card"><h2>🤖 or 🎬?</h2>' + C.script('Ten movie quotes. Half are real, half were written by an AI. Vote: human or AI?') + '<button class="btn big" data-act="start">First quote →</button></div>');
    },
    simulate, summary, acts,
  });
})();

</script>
